name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The required check for merging into main (branch protection requires `verify`). Every Gradle
  #  step is skipped while the repository has no Gradle wrapper, so the check still reports.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: hashFiles('gradlew') != ''
        with:
          distribution: temurin
          java-version: '21'
      # Also validates the Gradle wrapper's checksum, and caches Gradle state between runs.
      - uses: gradle/actions/setup-gradle@v6
        if: hashFiles('gradlew') != ''
      # Before the tests so that a formatting or static-analysis finding fails the job in seconds.
      #  Run ./gradlew ktfmtFormat to fix the formatting locally.
      - name: Check Kotlin formatting and static analysis
        if: hashFiles('gradlew') != ''
        run: ./gradlew ktfmtCheck detekt
      # The core's tests run on the JVM and on Wasm (Node), which keeps Java-only APIs out of shared
      #  code; the app's tests are Compose Desktop UI tests.
      - name: Run tests, check coverage and build the Linux package
        if: hashFiles('gradlew') != ''
        run: ./gradlew :core:allTests :app:desktopTest koverVerify :app:packageDeb
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/kover/**
