name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The required check for merging into main (branch protection requires `verify`).
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Also validates the Gradle wrapper's checksum, and caches Gradle state between runs.
      - uses: gradle/actions/setup-gradle@v6
      # scripts/ci.sh is the single definition of what CI runs: ktfmtCheck and detekt first so that a
      #  formatting or static-analysis finding fails the job in seconds (run ./gradlew ktfmtFormat to
      #  fix formatting locally), then the core's tests on the JVM and on Wasm (Node), the app's
      #  Compose Desktop UI tests, the Roborazzi screenshot check, coverage and the Linux package.
      - name: Check, test and package
        run: ./scripts/ci.sh
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/kover/**
            **/build/outputs/roborazzi/**
